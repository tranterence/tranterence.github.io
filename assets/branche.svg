<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260">
  <!-- Branche feuillue, utilisée en décoration dans les coins de l'accueil -->
  <defs>
    <linearGradient id="f1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ccc65"/>
      <stop offset="1" stop-color="#558b2f"/>
    </linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cb342"/>
      <stop offset="1" stop-color="#33691e"/>
    </linearGradient>
    <g id="feuille">
      <path d="M0 0 C 10 -14, 34 -14, 46 0 C 34 14, 10 14, 0 0 Z"/>
      <path d="M2 0 L 42 0" stroke="#2e5016" stroke-width="1.2" fill="none" opacity=".55"/>
    </g>
  </defs>
  <path d="M0 0 C 60 30, 110 70, 150 130 S 210 220, 250 255" stroke="#6d4c2f" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g fill="url(#f1)">
    <use href="#feuille" transform="translate(28 14) rotate(70)"/>
    <use href="#feuille" transform="translate(70 40) rotate(-20)"/>
    <use href="#feuille" transform="translate(104 72) rotate(80)"/>
    <use href="#feuille" transform="translate(140 118) rotate(-10)"/>
    <use href="#feuille" transform="translate(170 158) rotate(95)"/>
    <use href="#feuille" transform="translate(205 205) rotate(5)"/>
  </g>
  <g fill="url(#f2)">
    <use href="#feuille" transform="translate(48 26) rotate(-60)"/>
    <use href="#feuille" transform="translate(88 56) rotate(110) scale(.9)"/>
    <use href="#feuille" transform="translate(124 96) rotate(-55)"/>
    <use href="#feuille" transform="translate(156 140) rotate(120) scale(.9)"/>
    <use href="#feuille" transform="translate(190 182) rotate(-40)"/>
    <use href="#feuille" transform="translate(228 228) rotate(100) scale(.85)"/>
  </g>
</svg>
